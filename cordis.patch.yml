# dsh-toolbox bundle patch
#
# Applied as a profile bundle layer (through the `dsh.bundle.patch` manifest
# field). It inserts the one Loader row that owns both halves: the Node half
# (lib/index.js — restart, update feed check, window maximizing, the optional
# tray companion, session titles and the settings document) and the browser half
# (lib/client.js — the window-chrome buttons, the send-key translator, the AI
# rename row and the settings page), which the client module system discovers
# from `dsh.client` in package.json.
#
# The per-conversation spend readout is its own bundle now (`dsh-cost`).
- insert:
    - id: toolbox
      name: 'dsh-toolbox'
